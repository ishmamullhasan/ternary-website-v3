name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --no-deprecation

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --ignore-workspace install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --ignore-workspace install --frozen-lockfile
      # payload-types.ts is committed; typecheck against it (no DB needed).
      - run: pnpm exec tsc --noEmit

  test-int:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      DATABASE_URI: mongodb://localhost:27017/ci
      DATABASE_URL: mongodb://localhost:27017/ci
      PAYLOAD_SECRET: ci-not-a-secret
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      PREVIEW_SECRET: ci-not-a-secret
      CRON_SECRET: ci-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --ignore-workspace install --frozen-lockfile
      - run: pnpm test:int

  build:
    name: Build
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      DATABASE_URI: mongodb://localhost:27017/ci
      DATABASE_URL: mongodb://localhost:27017/ci
      PAYLOAD_SECRET: ci-not-a-secret
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      PREVIEW_SECRET: ci-not-a-secret
      CRON_SECRET: ci-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --ignore-workspace install --frozen-lockfile
      - run: pnpm build
